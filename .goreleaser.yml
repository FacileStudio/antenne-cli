version: 2

builds:
  - main: .
    binary: nook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/FacileStudio/nook-cli/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: nook
    homepage: https://github.com/FacileStudio/nook-cli
    description: Terminal client for a Nook instance
    directory: Formula
    repository:
      owner: FacileStudio
      name: homebrew-tap
      branch: main
      # Explicit, because the release workflow only exports GITHUB_TOKEN and a
      # cross-repo tap push needs its own.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "nook"
    test: |
      system "#{bin}/nook --version"

changelog:
  sort: asc
